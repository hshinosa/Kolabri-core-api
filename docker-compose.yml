version: "3.8"

services:
  # ============================================
  # Infrastructure
  # ============================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123hshi
      POSTGRES_DB: kolabri-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # Application Services
  # ============================================
  ai-engine:
    build:
      context: ./Kolabri-ai-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      HOST: "0.0.0.0"
      PORT: "8001"
      ENV: development
      DEBUG: "true"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: kolabri
      ENABLE_MONGODB_LOGGING: "true"
      CORE_API_URL: http://core-api:3000
      CORE_API_SECRET: shared-secret-key
      CHROMA_PERSIST_DIR: /app/data/chroma
      ENABLE_EFFICIENCY_GUARD: "true"
      CACHE_TTL_SECONDS: "3600"
      RATE_LIMIT_MAX_REQUESTS: "100"
      RATE_LIMIT_WINDOW_SECONDS: "60"
    env_file:
      - ./Kolabri-ai-engine/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  core-api:
    build:
      context: ./Kolabri-core-api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:123hshi@postgres:5432/kolabri-db?schema=public
      MONGODB_URL: mongodb://mongodb:27017/kolabri
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRES_IN: 7d
      AI_ENGINE_URL: http://ai-engine:8001
      CLIENT_URL: http://localhost:8000
      REDIS_URL: redis://redis:6379
      MAX_FILE_SIZE_MB: "10"
    env_file:
      - ./Kolabri-core-api/.env
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  client-app:
    build:
      context: ./Kolabri-client-app
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: kolabri-db
      DB_SCHEMA: app
      DB_USERNAME: postgres
      DB_PASSWORD: 123hshi
      API_BASE_URL: http://core-api:3000
      AI_ENGINE_URL: http://ai-engine:8001
      SOCKET_URL: http://core-api:3000
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    env_file:
      - ./Kolabri-client-app/.env
    depends_on:
      core-api:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
